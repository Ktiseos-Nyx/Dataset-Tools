appId: com.ktiseos-nyx.dataset-tools
productName: Dataset Tools
copyright: "Copyright © 2026 The Duskfall Portal Crew"

# The app bundle now contains only pure-JS files (.electron/main.js + preload.js
# + package.json) — sharp's native binary and the standalone server ship via
# extraResources, outside the asar. So we can keep asar ON (default) for tamper
# detection: electron-builder embeds a SHA-256 header hash, and the flipped fuse
# below makes Electron verify it at startup (Windows >= Electron 30).
asar: true

# ASAR integrity + refuse to load app code from anywhere but the packed archive.
# (electron-builder maps these boolean flags to the underlying @electron/fuses
# `FuseV1Options` values. `runAsNode` is left at its default so the packaged app
# can still spawn the standalone server via ELECTRON_RUN_AS_NODE.)
electronFuses:
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

# sharp ships prebuilt N-API binaries (@img/sharp-*) that work in Electron as-is;
# no rebuild needed. Skipping @electron/rebuild also avoids symlink creation,
# which fails on Windows without Developer Mode.
npmRebuild: false

# The standalone build (`.next/standalone`) already traces in every runtime
# dependency (incl. sharp + its @img native binaries). Ship it via extraResources
# (a raw copy electron-builder never scans for node_modules) so the collector
# doesn't see `sharp` twice and try to symlink-dedupe it — that symlink is what
# needs admin/Developer Mode on Windows. Only the main process + metadata live
# in the app bundle; node_modules is excluded so nothing redundant gets copied.
files:
  - .electron/**/*
  - package.json
  - "!node_modules/**/*"

# Copy from `.next` (not `.next/standalone`) so the standalone's node_modules
# is *nested* (`standalone/node_modules`) rather than at the copy root —
# electron-builder hard-excludes a node_modules that sits at the root of an
# extraResources source (see app-builder-lib/util/filter.js), which would drop
# sharp's native binary.
extraResources:
  - from: .next
    to: .
    filter:
      - "standalone/**/*"

directories:
  output: dist
  buildResources: build

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.icns
  category: public.app-category.productivity

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
